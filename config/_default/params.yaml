hugoblox:
  schema: "2.0"
  identity:
    name: Dr. Goulu
    type: person
    tagline: Pourquoi Comment Combien
    description: le blog du Dr. Goulu, tombé dans la science quand j'étais petit
  theme:
    mode: system
    pack: contrast
    colors:
      primary: ""
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: '© {year} Ph. Guglielmetti, contenu disponible sous licence [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr)'
  content:
    math:
      enable: true
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
  comments:
    enable: true
    provider: disqus
    disqus:
      shortname: drgoulu
