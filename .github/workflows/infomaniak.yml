name: Deploy website to Infomaniak

on:
  workflow_dispatch:
    inputs:
      deploy_method:
        description: 'Méthode de déploiement (ssh ou ftp)'
        required: false
        default: 'ssh'
        type: choice
        options:
          - ssh
          - ftp

permissions:
  contents: read

concurrency:
  group: 'deploy-infomaniak'
  cancel-in-progress: false

jobs:
  # Build website using reusable workflow build.yml
  build:
    if: github.repository_owner != 'HugoBlox'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Deploy website to Infomaniak using the build artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_METHOD: ${{ inputs.deploy_method || 'ssh' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      # -------------------------------------------------------------
      # Déploiement Option 1 : SSH / rsync (Recommandé pour Infomaniak)
      # -------------------------------------------------------------
      - name: Deploy via SSH (rsync)
        if: ${{ env.DEPLOY_METHOD == 'ssh' }}
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
          ARGS: "-rlgoDvz --delete"
          SOURCE: "public/"
          REMOTE_HOST: ${{ secrets.INFOMANIAK_HOST }}
          REMOTE_PORT: ${{ secrets.INFOMANIAK_PORT || '22' }}
          REMOTE_USER: ${{ secrets.INFOMANIAK_USER }}
          TARGET: ${{ secrets.INFOMANIAK_TARGET_DIR || '/sites/drgoulu.com/' }}
          EXCLUDES: "/.git/, /.github/"

      # -------------------------------------------------------------
      # Déploiement Option 2 : FTP / FTPS
      # -------------------------------------------------------------
      - name: Deploy via FTP / FTPS
        if: ${{ env.DEPLOY_METHOD == 'ftp' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          password: ${{ secrets.INFOMANIAK_PASSWORD }}
          server-dir: ${{ secrets.INFOMANIAK_TARGET_DIR || '/sites/drgoulu.com/' }}
          local-dir: './public/'
          protocol: ftps
