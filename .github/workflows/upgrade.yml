name: Upgrade HugoBlox

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Upgrade to version'
        required: true
        default: 'Stable'
        type: choice
        options:
        - Stable
        - Beta (Preview)
  schedule:
    # Run at 05:00 on Monday
    - cron: '0 5 * * 1'

permissions:
  contents: write
  pull-requests: write

# Prevent duplicate upgrade runs
concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Upgrade
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPGRADE_BRANCH: chore/upgrade-hugoblox-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json
          run_install: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Run Upgrade CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use manual input or default to stable for scheduled runs
          VERSION_TYPE: ${{ inputs.version_type || 'Stable' }}
        run: |
          FLAGS="--yes --ci"
          
          if [ "$VERSION_TYPE" == "Beta (Preview)" ]; then
            FLAGS="$FLAGS --canary"
          fi
          
          echo "Running upgrade with flags: $FLAGS"
          pnpm dlx hugoblox@latest upgrade $FLAGS

      - name: Commit and push upgrade branch
        id: push_upgrade
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upgrade changes detected."
            exit 0
          fi

          git checkout -B "$UPGRADE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deps): upgrade hugoblox modules"
          git push origin "$UPGRADE_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report PR creation status
        if: steps.push_upgrade.outputs.changed == 'true'
        run: |
          echo "::warning::This repository blocks PR creation by GitHub Actions token."
          echo "::notice::Open the upgrade PR manually:"
          echo "https://github.com/${{ github.repository }}/pull/new/${{ env.UPGRADE_BRANCH }}"
