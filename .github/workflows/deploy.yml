name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_path: ./package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Cache Hugo resources and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/hugo_cache
            resources
          key: hugo-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            hugo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Index search with Pagefind
        run: pnpm run pagefind

      # Artefact pour GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      # Artefact pour le déploiement Infomaniak
      - name: Upload site artifact for Infomaniak
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: ./public
          retention-days: 1

  # Déploiement 1 : GitHub Pages
  deploy-github-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Déploiement 2 : Infomaniak (via rsync / SSH)
  deploy-infomaniak:
    name: Deploy to Infomaniak
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: ./public

      - name: Normalize SSH deploy settings
        env:
          RAW_REMOTE_USER: ${{ secrets.INFOMANIAK_SSH_USER || secrets.INFOMANIAK_USER }}
          RAW_REMOTE_HOST: ${{ secrets.INFOMANIAK_SSH_HOST || secrets.INFOMANIAK_HOST }}
        run: |
          set -eu

          remote_user="$(printf '%s' "${RAW_REMOTE_USER}" | sed -E 's/^[[:space:]]*ssh(\\)?[[:space:]]+//; s/[[:space:]]+$//')"
          remote_host="$(printf '%s' "${RAW_REMOTE_HOST}" | sed -E 's/^[[:space:]]*ssh(\\)?[[:space:]]+//; s#[[:space:]]*ssh://##; s/[[:space:]]+$//')"

          if printf '%s' "${remote_user}" | grep -q '@'; then
            remote_host="$(printf '%s' "${remote_user}" | sed -E 's/^[^@]+@//')"
            remote_user="$(printf '%s' "${remote_user}" | sed -E 's/@.*$//')"
          fi

          remote_host="$(printf '%s' "${remote_host}" | sed -E 's#^[^@]+@##; s#/.*$##; s/:.*$//')"
          remote_user="$(printf '%s' "${remote_user}" | sed -E 's/[[:space:]].*$//')"

          echo "REMOTE_USER=${remote_user}" >> "${GITHUB_ENV}"
          echo "REMOTE_HOST=${remote_host}" >> "${GITHUB_ENV}"

      - name: Sync to Infomaniak via SSH/rsync
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "public/"
          REMOTE_HOST: ${{ env.REMOTE_HOST }}
          REMOTE_USER: ${{ env.REMOTE_USER }}
          TARGET: ${{ secrets.INFOMANIAK_TARGET_DIR }}
          REMOTE_PORT: ${{ secrets.INFOMANIAK_SSH_PORT || secrets.INFOMANIAK_PORT || 22 }}
          EXCLUDE: "/.git*"
