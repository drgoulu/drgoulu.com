name: Deploy Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_path: ./package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Cache Hugo resources and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/hugo_cache
            resources
          key: hugo-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            hugo-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            hugo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --gc --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Index search with Pagefind
        run: pnpm run pagefind

      # Artefact pour GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      # Artefact pour le déploiement Infomaniak
      - name: Upload site artifact for Infomaniak
        uses: actions/upload-artifact@v4
        with:
          name: public-site
          path: ./public
          retention-days: 1

  # Déploiement 1 : GitHub Pages
  deploy-github-pages:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Déploiement 2 : Infomaniak (via rsync / SSH)
  deploy-infomaniak:
    name: Deploy to Infomaniak
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: public-site
          path: ./public

      - name: Normalize SSH deploy settings
        env:
          RAW_REMOTE_USER: ${{ secrets.INFOMANIAK_SSH_USER || secrets.INFOMANIAK_USER }}
          RAW_REMOTE_HOST: ${{ secrets.INFOMANIAK_SSH_HOST || secrets.INFOMANIAK_HOST }}
        run: |
          set -eu

          remote_user="$(printf '%s' "${RAW_REMOTE_USER}" | sed -E 's/^[[:space:]]*ssh(\\)?[[:space:]]+//; s/[[:space:]]+$//')"
          remote_host="$(printf '%s' "${RAW_REMOTE_HOST}" | sed -E 's/^[[:space:]]*ssh(\\)?[[:space:]]+//; s#[[:space:]]*ssh://##; s/[[:space:]]+$//')"

          if printf '%s' "${remote_user}" | grep -q '@'; then
            remote_host="$(printf '%s' "${remote_user}" | sed -E 's/^[^@]+@//')"
            remote_user="$(printf '%s' "${remote_user}" | sed -E 's/@.*$//')"
          fi

          remote_host="$(printf '%s' "${remote_host}" | sed -E 's#^[^@]+@##; s#/.*$##; s/:.*$//')"
          remote_user="$(printf '%s' "${remote_user}" | sed -E 's/[[:space:]].*$//')"

          echo "REMOTE_USER=${remote_user}" >> "${GITHUB_ENV}"
          echo "REMOTE_HOST=${remote_host}" >> "${GITHUB_ENV}"
          echo "REMOTE_PORT=${{ secrets.INFOMANIAK_SSH_PORT || secrets.INFOMANIAK_PORT || 22 }}" >> "${GITHUB_ENV}"

      - name: Prepare SSH private key
        env:
          RAW_SSH_PRIVATE_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
        run: |
          set -eu

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"

          private_key_file="${HOME}/.ssh/infomaniak_deploy_key"
          strip_wrapping_quotes() {
            local value="${1}"

            case "${value}" in
              \"*\")
                value="${value#\"}"
                value="${value%\"}"
                ;;
              \'*\')
                value="${value#\'}"
                value="${value%\'}"
                ;;
            esac

            printf '%s' "${value}"
          }

          validate_private_key() {
            printf '%s\n' "${1}" > "${private_key_file}"
            chmod 600 "${private_key_file}"
            ssh-keygen -y -f "${private_key_file}" >/dev/null 2>&1
          }

          decode_base64() {
            if printf 'WA==' | base64 -d >/dev/null 2>&1; then
              printf '%s' "${1}" | base64 -d
            elif printf 'WA==' | base64 -D >/dev/null 2>&1; then
              printf '%s' "${1}" | base64 -D
            else
              return 1
            fi
          }

          invalid_key_error() {
            echo "::error::INFOMANIAK_SSH_KEY is not a valid SSH private key. Store the raw key, an escaped-newline version, or a base64-encoded copy of the key." >&2
          }

          normalized_key="$(strip_wrapping_quotes "$(printf '%s' "${RAW_SSH_PRIVATE_KEY}" | tr -d '\r')")"

          if ! validate_private_key "${normalized_key}"; then
            escaped_key="$(strip_wrapping_quotes "$(printf '%b' "${normalized_key}")")"

            if validate_private_key "${escaped_key}"; then
              :
            elif decoded_key="$(decode_base64 "${normalized_key}" 2>/dev/null)"; then
              if validate_private_key "${decoded_key}"; then
                :
              else
                invalid_key_error
                exit 1
              fi
            else
              invalid_key_error
              exit 1
            fi
          fi

          echo "SSH_PRIVATE_KEY_FILE=${private_key_file}" >> "${GITHUB_ENV}"

      - name: Add Infomaniak host key
        run: |
          set -eu
          ssh-keyscan -p "${REMOTE_PORT}" -H "${REMOTE_HOST}" >> "${HOME}/.ssh/known_hosts"

      - name: Sync to Infomaniak via SSH/rsync
        env:
          TARGET: ${{ secrets.INFOMANIAK_TARGET_DIR }}
        run: |
          set -eu

          rsync -rlgoDzvc -i --delete --exclude='/.git*' \
            -e "ssh -p ${REMOTE_PORT} -i ${SSH_PRIVATE_KEY_FILE} -o StrictHostKeyChecking=yes" \
            public/ "${REMOTE_USER}@${REMOTE_HOST}:${TARGET}"
