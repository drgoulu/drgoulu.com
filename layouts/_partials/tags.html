{{ if .Params.tags }}
<div class="flex justify-center flex-wrap gap-2">
  {{ range $index, $value := (.GetTerms "tags") }}
    {{/* Only show tags that link to at least 2 articles */}}
    {{ if gt (len .Pages) 1 }}
      <a class="no-underline bg-primary-100 hover:bg-primary-300 text-primary-800 text-xs font-medium px-2.5 py-0.5 lg:px-5 lg:py-2 rounded dark:bg-primary-900 dark:hover:bg-primary-700 dark:text-primary-300" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
    {{ end }}
  {{ end }}
</div>
{{ end }}
